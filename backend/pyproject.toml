[project]
name = "reader-backend"
version = "0.1.0"
description = "Reader 阅读器的后端：书籍文件、阅读进度与批注的持久化"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["watchfiles>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
